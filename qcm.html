  bits>>>=0;
  let best=99,second=99,bid=-1,bk=0;
  const R=spec.rots;
  for(let id=0;id<R.length;id++){for(let k=0;k<4;k++){const e=popcnt((bits^R[id][k])>>>0);if(e<best){second=best;best=e;bid=id;bk=k;}else if(e<second)second=e;}}
  if(best>maxErr)return null;
  if(best>0&&second<=best+1)return null; // ambigu : on préfère ne rien lire
  const size=Math.hypot(q[2][0]-q[0][0],q[2][1]-q[0][1]);
  return {id:bid+1,answer:ROT_LETTER[bk],rot:bk,err:best,corners:q,size};

function readKV(name) {
  return new Promise(res => {
    let r;
    try { r = indexedDB.open(name); } catch (e) { return res(null); }
    r.onupgradeneeded = () => { try { r.transaction.abort(); } catch (_) {} res(null); };
    r.onsuccess = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains('kv')) { db.close(); return res(null); }
      try {
        const q = db.transaction('kv', 'readonly').objectStore('kv').get('data');
        q.onsuccess = () => { db.close(); res(q.result || null); };
        q.onerror = () => { db.close(); res(null); };
      } catch (e) { db.close(); res(null); }
    };
    r.onerror = () => res(null);
  });
}
function writeProgCards(maps) {
  // n'écrit que la clé config.qcmCards des données de Progression (même algorithme de numérotation)
  return new Promise(res => {
    let r;
    try { r = indexedDB.open('progression-classe-db'); } catch (e) { return res(false); }
    r.onupgradeneeded = () => { try { r.transaction.abort(); } catch (_) {} res(false); };
    r.onsuccess = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains('kv')) { db.close(); return res(false); }
      let ok = false;
      try {
        const tx = db.transaction('kv', 'readwrite'), st = tx.objectStore('kv'), q = st.get('data');
        q.onsuccess = () => {
          const d = q.result;
          if (!d || !d.config) return;
          d.config.qcmCards = d.config.qcmCards || {};
          for (const [k, m] of Object.entries(maps)) d.config.qcmCards[k] = Object.assign(d.config.qcmCards[k] || {}, m);
          st.put(d, 'data'); ok = true;
        };
        tx.oncomplete = () => { db.close(); res(ok); };
        tx.onerror = () => { db.close(); res(false); };
      } catch (e) { db.close(); res(false); }
    };
    r.onerror = () => res(false);
  });
}
async function loadLinked() {
  const [suivi, prog] = await Promise.all([readKV('suivi-classe-db'), readKV('progression-classe-db')]);
  SUIVI_LOCK = suivi && suivi.lock && suivi.lock.hash ? suivi.lock : null;
  const classes = suivi && Array.isArray(suivi.classes) ? suivi.classes : [];
  const hasProg = !!(prog && prog.config);
  if (!DB.cardMaps) DB.cardMaps = {};
  const store = hasProg ? (prog.config.qcmCards || {}) : DB.cardMaps;
  const changed = {};
  LINKED = classes.map(c => {
    const studs = (c.students || []).filter(s => s && s.id);
    const m = Object.assign({}, store[c.id] || {});

    studs.slice().sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'fr')).forEach(st => { if (!m[st.id]) { m[st.id] = ++max; ch = true; } });
    if (ch) changed[c.id] = m;

function cleanTitle(s) { return String(s || '').replace(/\s*\{[^}]*\}\s*$/, '').trim(); }

function parseMarkdown(text) {
  const lines = String(text).replace(/\r/g, '').split('\n');
  let name = '';
  const qs = [];
  let cur = null, warn = 0;
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, '');
    let m;
    if ((m = line.match(/^#\s+(.*)/))) { if (!name && !cur) name = cleanTitle(m[1]); continue; }
    if ((m = line.match(/^#{2,3}\s+(.*)/))) { cur = { id: uid(), text: cleanTitle(m[1]), image: '', answers: [] }; qs.push(cur); continue; }
    if (!cur) continue;
    if ((m = line.match(/^\s*[-*+]\s+(?:\[( |x|X)\]\s?)?(.*)$/))) {
      if (cur.answers.length < 4) cur.answers.push({ text: m[2].trim(), correct: (m[1] || '').toLowerCase() === 'x' });
      else warn++;
      continue;
    }
    if ((m = line.match(/!\[[^\]]*\]\(\s*([^)\s]+)[^)]*\)/))) {
      if (!cur.image) cur.image = m[1];
      const rest = line.replace(m[0], '').trim();
      if (rest) cur.text += '\n' + rest;
      continue;
    }
    if (line.trim()) cur.text += '\n' + line.trim();
  }
  return { qcm: { id: uid(), name: name || 'QCM importé', updatedAt: Date.now(), questions: qs }, warn };
}

function parseAiken(text) {
  const blocks = String(text).replace(/\r/g, '').split(/\n\s*\n/);
  const qs = [];
  for (const b of blocks) {
    const lines = b.split('\n').map(l => l.trim()).filter(Boolean);
    if (!lines.length) continue;
    const q = { id: uid(), text: '', image: '', answers: [] };
    let ansLetter = '';
    const tl = [];
    for (const l of lines) {
      let m;
      if ((m = l.match(/^([A-Z])[.)]\s*(.*)$/)) && (q.answers.length || tl.length)) { if (q.answers.length < 4) q.answers.push({ text: m[2], correct: false, _l: m[1] }); }
      else if ((m = l.match(/^ANSWER\s*:\s*([A-Z])/i))) ansLetter = m[1].toUpperCase();
      else if (!q.answers.length) tl.push(l);
    }
    q.text = tl.join('\n');
    q.answers.forEach(a => { a.correct = a._l === ansLetter; delete a._l; });
    if (q.text) qs.push(q);
  }
  return { qcm: { id: uid(), name: 'QCM importé (Aiken)', updatedAt: Date.now(), questions: qs }, warn: 0 };
}

function qcmFromQcmcamJSON(q) {
  // Format "QCMCamSyncBundle" (sauvegarde intégrale QCMCam 2)
  if (q.type === 'markdown' && q.markdownSource && q.markdownSource.trim()) {
    const r = parseMarkdown(q.markdownSource);
    r.qcm.name = q.name || r.qcm.name;
    return r.qcm;
  }
  const questions = (q.questions || []).map(qu => ({
    id: uid(),
    text: htmlToText(qu.content),
    image: htmlFirstImg(qu.content),
    answers: (qu.answers || []).slice(0, 4).map(a => ({ text: htmlToText(a.content), correct: !!a.correct }))
  }));
  return { id: uid(), name: q.name || 'QCM importé', updatedAt: Date.now(), questions };
}
const qcmIsEmpty = q => !q.questions.some(qu => qu.answers.some(a => a.text.trim()));

function importAny(text) {
  const t = String(text || '').trim();
  if (!t) return { error: 'Rien à importer.' };
  if (t[0] === '{' || t[0] === '[') {
    let data;
    try { data = JSON.parse(t); } catch (e) { return { error: 'Fichier JSON illisible.' }; }
    // Sauvegarde QCMScan
    if (data && data.app === 'QCMScan') return { backup: data };
    // Sauvegarde intégrale QCMCam
    if (data && data.format === 'QCMCamSyncBundle') {
      const qcms = (data.qcms || []).map(qcmFromQcmcamJSON).filter(q => !qcmIsEmpty(q));
      const stud = new Map((data.students || []).map(s => [s.id, s]));
      const groups = (data.groups || []).filter(g => (g.studentIds || []).length).map(g => ({
        id: uid(), name: g.name || 'Classe',
        students: g.studentIds.map(id => stud.get(id)).filter(Boolean).map(s => ({
          id: uid(), nom: String(s.name || '').replace(/^"+|"+$/g, ''), prenom: s.firstname || '', card: s.markerId || null
        }))
      }));
      groups.forEach(fixCards);
      return { qcms, groups };
    }
    // Export individuel QCMCam 2 ({qcm:{_name}, questions:[{_content,_answers}]})
    if (data && Array.isArray(data.questions)) {
      const questions = data.questions.map(qu => ({
        id: uid(), text: htmlToText(qu._content ?? qu.content), image: htmlFirstImg(qu._content ?? qu.content),
        answers: (qu._answers || qu.answers || []).slice(0, 4).map(a => ({ text: htmlToText(a._content ?? a.content), correct: !!(a._isCorrect ?? a.isCorrect ?? a.correct) }))
      }));
      const name = (data.qcm && (data.qcm._name || data.qcm.name)) || data.name || 'QCM importé';
      return { qcms: [{ id: uid(), name, updatedAt: Date.now(), questions }], groups: [] };
    }
    return { error: "Format JSON non reconnu." };
  }
  if (/^ANSWER\s*:/mi.test(t) && !/^#{1,3}\s/m.test(t)) { const r = parseAiken(t); return { qcms: [r.qcm], groups: [], warn: r.warn }; }
  const r = parseMarkdown(t);
  if (!r.qcm.questions.length) return { error: "Aucune question trouvée (une question commence par « ## »)." };
  return { qcms: [r.qcm], groups: [], warn: r.warn };
}

function qcmToMarkdown(q) {
  let s = `# ${q.name}\n\n`;
  for (const qu of q.questions) {
    const [first, ...rest] = (qu.text || 'Question').split('\n');
    s += `## ${first}\n\n`;
    if (rest.length) s += rest.join('\n') + '\n\n';
    if (qu.image && !qu.image.startsWith('data:')) s += `![image](${qu.image})\n\n`;
    for (const a of qu.answers) s += `- [${a.correct ? 'x' : ' '}] ${a.text}\n`;
    s += '\n';
  }
  return s;
}

function fixCards(g) {
  const used = new Set();
  for (const s of g.students) {
    const c = parseInt(s.card, 10);
    if (c >= 1 && c <= maxCard() && !used.has(c)) { s.card = c; used.add(c); } else s.card = null;
  }
  let n = 1;
  for (const s of g.students) if (!s.card) { while (used.has(n)) n++; s.card = n; used.add(n); }
}
function parseStudents(text) {
  let lines = String(text).replace(/\r/g, '').split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) return [];
  const splitL = l => l.split(/\t|;/).map(s => s.trim());
  let map = null;
  const head = splitL(lines[0]).map(h => h.toLowerCase());
  if (head.length > 1 && head.some(h => h.startsWith('nom')) ) {
    map = { nom: head.findIndex(h => h === 'nom' || h.startsWith('nom')), prenom: head.findIndex(h => h.startsWith('pr')), card: head.findIndex(h => /carte|marqueur|num/.test(h)) };
    lines = lines.slice(1);
  } else if (/^(nom|élève|eleve)\b/i.test(lines[0])) lines = lines.slice(1);
  return lines.map(l => {
    const parts = splitL(l);
    if (map) return { nom: parts[map.nom] || '', prenom: map.prenom >= 0 ? parts[map.prenom] || '' : '', card: map.card >= 0 ? parseInt(parts[map.card], 10) || null : null };
    if (parts.length >= 2) {
      let card = null;
      if (/^\d+$/.test(parts[parts.length - 1])) card = parseInt(parts.pop(), 10);
      return { nom: parts[0], prenom: parts.slice(1).join(' '), card };
    }
    const words = l.split(/\s+/);
    const up = [];
    let i = 0;
    while (i < words.length - 1 && words[i] === words[i].toUpperCase() && /[A-ZÀ-Þ]/.test(words[i])) up.push(words[i++]);
    if (!up.length) { up.push(words[0]); i = 1; }
    return { nom: up.join(' '), prenom: words.slice(i).join(' '), card: null };
  }).filter(s => s.nom || s.prenom);
}

function cardSVG(n, name = '', showNum = true) {
  const spec = CARD_SETS[cardSet()];
  const N = spec.n, G = spec.g, cs = 70 / N;
  const bits = spec.codes[n - 1] || 0;
  let rects = '';
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const border = r === 0 || c === 0 || r === N - 1 || c === N - 1;
    const white = !border && ((bits >> ((r - 1) * G + (c - 1))) & 1);
    if (!white) rects += `<rect x="${(25 + c * cs).toFixed(3)}" y="${(25 + r * cs).toFixed(3)}" width="${(cs + 0.35).toFixed(3)}" height="${(cs + 0.35).toFixed(3)}"/>`;
  }
  const L = (x, y, rot, t) => `<text x="${x}" y="${y}" transform="rotate(${rot} ${x} ${y})" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="800" font-family="Arial, Helvetica, sans-serif">${t}</text>`;
  // nom dans le coin haut droit, comprimé pour ne jamais toucher la lettre A (x ≤ 68)
  const nmTxt = name.length > 26 ? name.slice(0, 25) + '…' : name;
  const nmFit = nmTxt.length * 3.6 > 42 ? ' textLength="42" lengthAdjust="spacingAndGlyphs"' : '';
  const nm = name ? `<text x="116" y="11" text-anchor="end" font-size="6.2" font-family="Arial, Helvetica, sans-serif" fill="#222"${nmFit}>${esc(nmTxt)}</text>` : '';
  const num = showNum ? `<text x="4" y="11" font-size="8" font-weight="700" font-family="Arial, Helvetica, sans-serif">${n}</text>` : '';
  return `<svg class="card-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect x="0.4" y="0.4" width="119.2" height="119.2" fill="#fff" stroke="#bbb" stroke-width="0.4" stroke-dasharray="2 2"/><g fill="#000" shape-rendering="crispEdges">${rects}</g>${L(60, 11, 0, 'A')}${L(109, 60, 90, 'B')}${L(60, 109, 180, 'C')}${L(11, 60, 270, 'D')}${num}${nm}</svg>`;
}
const LAYOUTS = { 1: { cols: 1, size: 185 }, 2: { cols: 1, size: 136 }, 4: { cols: 2, size: 96 }, 9: { cols: 3, size: 63 }, 20: { cols: 4, size: 47 } };
function cardsToPrint() {
  const o = UI.cards;
  if (o.source === 'group') {
    const g = getGroup(o.groupId);
    if (!g) return [];
    return g.students.slice().sort((a, b) => a.card - b.card).map(s => ({ n: s.card, name: o.names ? `${s.prenom} ${s.nom}`.trim() : '' }));
  }
  const a = Math.max(1, Math.min(maxCard(), +o.from || 1)), b = Math.max(a, Math.min(maxCard(), +o.to || a));
  const out = [];
  for (let n = a; n <= b; n++) out.push({ n, name: '' });
  return out;
}
function printCards() {
  const list = cardsToPrint();
  if (!list.length) return toast('Aucune carte à imprimer', 'warn');
  const lay = LAYOUTS[UI.cards.perPage] || LAYOUTS[4];
  const per = +UI.cards.perPage;
  let html = '';
  for (let i = 0; i < list.length; i += per) {
    html += `<div class="sheet" style="grid-template-columns:repeat(${lay.cols},${lay.size}mm);gap:4mm">` +
      list.slice(i, i + per).map(c => `<div class="pcard" style="width:${lay.size}mm;height:${lay.size}mm">${cardSVG(c.n, c.name)}</div>`).join('') + `</div>`;
  }
  $('#print-root').innerHTML = html;
  setTimeout(() => window.print(), 150);
}

// ---------- Modales ----------
function modal(html, wide = false) {
  $('#modal-root').innerHTML = `<div id="modal-bg" class="fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center p-3">
    <div class="bg-white rounded-2xl shadow-2xl w-full ${wide ? 'max-w-3xl' : 'max-w-lg'} max-h-[92vh] overflow-auto p-5">${html}</div></div>`;
  $('#modal-bg').addEventListener('click', e => { if (e.target.id === 'modal-bg') closeModal(); });
}
function closeModal() { $('#modal-root').innerHTML = ''; }
function confirmBox(msg, okLabel = 'Confirmer', danger = true) {
  return new Promise(res => {
    modal(`<p class="text-lg mb-6">${msg}</p><div class="flex justify-end gap-3"><button class="btn" id="cb-no">Annuler</button><button class="btn ${danger ? 'btn-red' : 'btn-blue'}" id="cb-ok">${okLabel}</button></div>`);
    $('#cb-no').onclick = () => { closeModal(); res(false); };
    $('#cb-ok').onclick = () => { closeModal(); res(true); };
  });
}
function promptBox(msg, value = '') {
  return new Promise(res => {
    modal(`<p class="font-semibold mb-3">${msg}</p><input id="pb-in" class="inp mb-5" value="${esc(value)}"><div class="flex justify-end gap-3"><button class="btn" id="pb-no">Annuler</button><button class="btn btn-blue" id="pb-ok">OK</button></div>`);
    const i = $('#pb-in'); i.focus(); i.select();
    $('#pb-no').onclick = () => { closeModal(); res(null); };
    $('#pb-ok').onclick = () => { closeModal(); res(i.value); };
    i.onkeydown = e => { if (e.key === 'Enter') { closeModal(); res(i.value); } };
  });
}

async function doImport() {
  let text = $('#imp-text').value;
  const f = $('#imp-file').files[0];
  if (f) text = await f.text();
  const r = importAny(text);
  if (r.error) return toast(r.error, 'err');
  if (r.backup) { closeModal(); return restoreBackup(r.backup); }
  closeModal();
  DB.qcms.push(...r.qcms);
  if (r.groups && r.groups.length) DB.groups.push(...r.groups);
  save();
  const parts = [];
  if (r.qcms.length) parts.push(`${r.qcms.length} QCM`);
  if (r.groups && r.groups.length) parts.push(`${r.groups.length} classe(s) (${r.groups.reduce((n, g) => n + g.students.length, 0)} élèves)`);
  toast(parts.length ? `Importé : ${parts.join(' et ')}` : 'Rien de nouveau à importer', parts.length ? 'ok' : 'warn', 3500);
  if (r.warn) setTimeout(() => toast(`${r.warn} réponse(s) au-delà de 4 ignorée(s)`, 'warn', 3500), 3600);
  if (r.qcms.length === 1 && !(r.groups || []).length) { UI.editQcm = r.qcms[0].id; UI.tab = 'edit'; }
  render();
}

function resizeImage(file, max = 1000) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}

function sessionStats(s) {
  const scorable = s.questions.map((q, i) => ({ i, good: q.answers.map((a, j) => a.correct ? LETTERS[j] : null).filter(Boolean) })).filter(x => x.good.length);
  const rows = s.students.map(st => {
    let pts = 0, answered = 0;
    for (const { i, good } of scorable) { const v = (s.votes[i] || {})[st.card]; if (v) answered++; if (v && good.includes(v)) pts++; }
    return { st, pts, answered, note: scorable.length ? Math.round(pts / scorable.length * 40) / 2 : 0 };
  });
  const perQ = s.questions.map((q, i) => {
    const good = q.answers.map((a, j) => a.correct ? LETTERS[j] : null).filter(Boolean);
    const votes = Object.values(s.votes[i] || {});
    const ok = votes.filter(v => good.includes(v)).length;
    return { n: votes.length, ok, pct: votes.length && good.length ? Math.round(ok / votes.length * 100) : null };
  });
  return { scorable, rows, perQ };
}

function exportCSV(s) {

let wakeLock = null;
async function requestWakeLock() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
function releaseWakeLock() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }
let audioCtx = null;
function beep() {
  if (!DB.settings.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880; o.type = 'sine';
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.12);
    o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.13);
  } catch (e) {}
}
async function startScan() {
  if (Cam.running) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return toast('Caméra indisponible : ouvrez la page en https (GitHub Pages) dans Safari.', 'err', 5000);
  }
  try {
    if (DB.settings.sound) { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume && audioCtx.resume(); }
  } catch (e) {}
  try {
    Cam.stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: DB.settings.facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
  } catch (e) {
    return toast(e && e.name === 'NotAllowedError' ? "Accès à la caméra refusé (Réglages > Safari > Caméra)." : "Impossible d'ouvrir la caméra.", 'err', 5000);
  }
  Cam.video.srcObject = Cam.stream;
  try { await Cam.video.play(); } catch (e) {}
  Cam.running = true; Cam.hist.clear(); Cam.frame = 0;
  requestWakeLock();
  const idle = $('#cam-idle', Cam.box); if (idle) idle.style.display = 'none';
  const b = $('#scan-btn'); if (b) { b.textContent = '■ Arrêter'; b.classList.remove('btn-blue'); b.classList.add('btn-red'); }
  Cam.raf = requestAnimationFrame(camLoop);
}
function stopScan() {
  Cam.running = false;
  cancelAnimationFrame(Cam.raf);
  if (Cam.stream) Cam.stream.getTracks().forEach(t => t.stop());
  Cam.stream = null;
  Cam.video.srcObject = null;
  const ctx = Cam.overlay.getContext('2d'); ctx.clearRect(0, 0, Cam.overlay.width, Cam.overlay.height);
  const idle = $('#cam-idle', Cam.box); if (idle) idle.style.display = 'grid';
  const b = $('#scan-btn'); if (b) { b.textContent = '📷 Scanner'; b.classList.remove('btn-red'); b.classList.add('btn-blue'); }
  $('#cam-fps', Cam.box).textContent = '';
}
function camLoop(t) {
  if (!Cam.running) return;
  const v = Cam.video;
  if (v.readyState >= 2 && v.videoWidth) {
    if (v.style.aspectRatio !== `${v.videoWidth} / ${v.videoHeight}`) v.style.aspectRatio = `${v.videoWidth} / ${v.videoHeight}`;
    const W = Math.min(+DB.settings.procWidth || 960, v.videoWidth);
    const H = Math.round(W * v.videoHeight / v.videoWidth);
    if (Cam.work.width !== W || Cam.work.height !== H) {
      Cam.work.width = W; Cam.work.height = H;
      Cam.wctx = Cam.work.getContext('2d', { willReadFrequently: true });
      Cam.gray = new Uint8Array(W * H);
    }
    Cam.wctx.drawImage(v, 0, 0, W, H);
    const d = Cam.wctx.getImageData(0, 0, W, H).data, g = Cam.gray;
    for (let i = 0, j = 0; j < g.length; i += 4, j++) g[j] = (d[i] * 77 + d[i + 1] * 150 + d[i + 2] * 29) >> 8;
    let dets = [];
    try { dets = detectMarkers(g, W, H, { set: cardSet(), C: +DB.settings.threshold || 7, minSide: 8 }); } catch (e) { console.error(e); }
    handleDetections(dets, W, H);
    // fréquence d'analyse
    Cam.frame++;
    if (t - Cam.fpsT > 1000) { $('#cam-fps', Cam.box).textContent = `${Cam.fps} img/s`; Cam.fps = 0; Cam.fpsT = t; }
    Cam.fps++;
  }
  Cam.raf = requestAnimationFrame(camLoop);
}
function handleDetections(dets, W, H) {
  const A = DB.active;
  if (!A) return;
  const qi = A.qIndex, q = A.qcm.questions[qi];
  const valid = new Set(A.students.map(s => s.card));
  const need = +DB.settings.confirmFrames || 2;
  const ov = Cam.overlay, rect = ov.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  if (ov.width !== Math.round(rect.width * dpr)) { ov.width = Math.round(rect.width * dpr); ov.height = Math.round(rect.height * dpr); }
  const ctx = ov.getContext('2d');
  ctx.clearRect(0, 0, ov.width, ov.height);
  const sx = ov.width / W, sy = ov.height / H;
  let changed = false;
  for (const m of dets) {
    const ok = valid.has(m.id) && LETTERS.indexOf(m.answer) < q.answers.length;
    if (ok) {
      const h = Cam.hist.get(m.id);
      if (h && h.ans === m.answer && Cam.frame - h.last <= 2) { h.count++; h.last = Cam.frame; }
      else Cam.hist.set(m.id, { ans: m.answer, count: 1, last: Cam.frame });
      const hh = Cam.hist.get(m.id);
      if (hh.count >= need) {
        const votes = A.votes[qi] || (A.votes[qi] = {});
        const cur = votes[m.id];
        if (cur !== m.answer && (!cur || DB.settings.allowChange)) { votes[m.id] = m.answer; changed = true; }
      }
    }
    // dessin
    const c = m.corners;
    const registered = (A.votes[qi] || {})[m.id] === m.answer;
    ctx.lineWidth = 3 * dpr;
    ctx.strokeStyle = !ok ? '#94a3b8' : registered ? '#22c55e' : '#facc15';
    ctx.beginPath();
    c.forEach((p, i) => i ? ctx.lineTo(p[0] * sx, p[1] * sy) : ctx.moveTo(p[0] * sx, p[1] * sy));
    ctx.closePath(); ctx.stroke();
    const cx = (c[0][0] + c[1][0] + c[2][0] + c[3][0]) / 4 * sx, cy = (c[0][1] + c[1][1] + c[2][1] + c[3][1]) / 4 * sy;
    const label = DB.settings.showLetters ? `${m.id} ${m.answer}` : `${m.id}`;
    ctx.font = `bold ${14 * dpr}px -apple-system, sans-serif`;
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(15,23,42,.8)';
    ctx.fillRect(cx - tw / 2 - 4 * dpr, cy - 10 * dpr, tw + 8 * dpr, 20 * dpr);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, cx, cy);
  }
  if (changed) {
    beep(); save(); updateLive();
    if (DB.settings.autoStop && Object.keys(A.votes[qi]).length >= A.students.length) { stopScan(); toast('Tout le monde a voté ✔'); }
  }
}
function changeQuestion(delta) {
  const A = DB.active;
  const ni = A.qIndex + delta;
  if (ni < 0 || ni >= A.qcm.questions.length) return;
  if (Cam.running) stopScan();
  A.qIndex = ni; save(); render();
}
document.addEventListener('visibilitychange', () => { if (document.hidden && Cam.running) stopScan(); });

// ======================================================================
//  Actions (délégation d'événements)
// ======================================================================
const ACT = {
  'tab': el => { if (el.dataset.tab === 'qcm') UI.editQcm = null; goTab(el.dataset.tab); },
  'modal-close': () => closeModal(),
  'home': async () => { if (Cam.running) stopScan(); await saveNow(); location.href = 'index.html'; },
  // QCM
  'qcm-new': () => { const q = { id: uid(), name: 'Nouveau QCM', updatedAt: Date.now(), questions: [newQuestion()] }; DB.qcms.push(q); save(); UI.editQcm = q.id; goTab('edit'); },
  'qcm-edit': el => { UI.editQcm = el.dataset.id; goTab('edit'); },
  'qcm-run': el => {
    if (DB.active) { toast('Une séance est déjà en cours : terminez-la d\'abord.', 'warn', 3500); return goTab('session'); }
    UI.setupQcm = el.dataset.id; goTab('session');
  },
  'qcm-dup': el => { const q = clone(getQcm(el.dataset.id)); q.id = uid(); q.name += ' (copie)'; q.updatedAt = Date.now(); q.questions.forEach(x => x.id = uid()); DB.qcms.push(q); save(); render(); },
  'qcm-export': el => { const q = getQcm(el.dataset.id); download(slug(q.name) + '.md', qcmToMarkdown(q), 'text/markdown'); },
  'qcm-del': async el => { const q = getQcm(el.dataset.id); if (await confirmBox(`Supprimer le QCM « ${esc(q.name)} » ?`, 'Supprimer')) { DB.qcms = DB.qcms.filter(x => x.id !== q.id); save(); render(); } },
  'import-open': () => openImport(),
  'import-do': () => doImport(),
  // éditeur
  'q-add': () => { const q = getQcm(UI.editQcm); q.questions.push(newQuestion()); touchQcm(q); render(); setTimeout(() => { const el = $(`#qb-${q.questions.length - 1}`); el && el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el && el.querySelector('textarea').focus(); }, 50); },
  'q-del': async el => { const q = getQcm(UI.editQcm); if (await confirmBox('Supprimer cette question ?', 'Supprimer')) { q.questions.splice(+el.dataset.qi, 1); touchQcm(q); render(); } },
  'q-dup': el => { const q = getQcm(UI.editQcm); const i = +el.dataset.qi; const c = clone(q.questions[i]); c.id = uid(); q.questions.splice(i + 1, 0, c); touchQcm(q); render(); },
  'q-up': el => { const q = getQcm(UI.editQcm); const i = +el.dataset.qi; if (i > 0) { [q.questions[i - 1], q.questions[i]] = [q.questions[i], q.questions[i - 1]]; touchQcm(q); render(); } },
  'q-down': el => { const q = getQcm(UI.editQcm); const i = +el.dataset.qi; if (i < q.questions.length - 1) { [q.questions[i + 1], q.questions[i]] = [q.questions[i], q.questions[i + 1]]; touchQcm(q); render(); } },
  'q-imgurl': async el => { const q = getQcm(UI.editQcm); const qu = q.questions[+el.dataset.qi]; const u = await promptBox("Adresse (URL) de l'image :", qu.image && !qu.image.startsWith('data:') ? qu.image : 'https://'); if (u !== null) { qu.image = u.trim() === 'https://' ? '' : u.trim(); touchQcm(q); render(); } },
  'q-imgdel': el => { const q = getQcm(UI.editQcm); q.questions[+el.dataset.qi].image = ''; touchQcm(q); render(); },
  'a-add': el => { const q = getQcm(UI.editQcm); const qu = q.questions[+el.dataset.qi]; if (qu.answers.length < 4) { qu.answers.push({ text: '', correct: false }); touchQcm(q); render(); } },
  'a-del': el => { const q = getQcm(UI.editQcm); q.questions[+el.dataset.qi].answers.splice(+el.dataset.ai, 1); touchQcm(q); render(); },
  // classes
  'g-new': async () => { const name = await promptBox('Nom de la classe :', ''); if (name && name.trim()) { const g = { id: uid(), name: name.trim(), students: [] }; DB.groups.push(g); UI.groupSel = g.id; save(); render(); } },
  'g-sel': el => { UI.groupSel = el.dataset.id; render(); },
  'g-del': async () => { const g = getGroup(UI.groupSel); if (await confirmBox(`Supprimer la classe « ${esc(g.name)} » et ses ${g.students.length} élèves ?`, 'Supprimer')) { DB.groups = DB.groups.filter(x => x.id !== g.id); UI.groupSel = null; save(); render(); } },
  'g-renum': async () => { const g = getGroup(UI.groupSel); if (await confirmBox('Renuméroter les cartes de 1 à n dans l\'ordre alphabétique ? Les élèves devront prendre leur nouvelle carte.', 'Renuméroter', false)) { g.students.sort((a, b) => (a.nom + a.prenom).localeCompare(b.nom + b.prenom, 'fr')).forEach((s, i) => s.card = i + 1); save(); render(); } },
  'g-cards': () => { UI.cards.source = 'group'; UI.cards.groupId = UI.groupSel; goTab('cards'); },
  's-add': () => { const g = getGroup(UI.groupSel); g.students.push({ id: uid(), nom: '', prenom: '', card: null }); fixCards(g); save(); render(); const ins = $$('[data-f="snom"]'); const last = g.students.length - 1; const el = ins.find(i => +i.dataset.si === last); el && el.focus(); },
  's-del': el => { const g = getGroup(UI.groupSel); g.students.splice(+el.dataset.si, 1); save(); render(); },
  's-paste': () => openPaste(),
  'paste-do': () => {
    const g = getGroup(UI.groupSel);
    const list = parseStudents($('#paste-text').value);
    if (!list.length) return toast('Aucun élève reconnu', 'warn');
    if ($('#paste-replace').checked) g.students = [];
    g.students.push(...list.map(s => ({ id: uid(), nom: s.nom, prenom: s.prenom, card: s.card })));
    fixCards(g); save(); closeModal(); render(); toast(`${list.length} élève(s) ajouté(s)`);
  },
  // cartes
  'print': () => printCards(),
  // réglages
  'backup': () => { const d = clone(DB); d.active = null; d.exportedAt = new Date().toISOString(); download(`qcmscan_sauvegarde_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(d, null, 1), 'application/json'); },
  'wipe': async () => {
    if (!(await confirmBox('Effacer <strong>toutes</strong> les données (QCM, classes, résultats) de cette tablette ?', 'Continuer'))) return;
    if (!(await confirmBox('Vraiment ? Cette action est définitive. Avez-vous exporté une sauvegarde ?', 'Tout effacer'))) return;
    if (Cam.running) stopScan();
    DB = { app: 'QCMScan', version: 1, qcms: [], groups: [], sessions: [], active: null, settings: { ...DEFAULT_SETTINGS } };
    await saveNow(); render(); toast('Données effacées');
  },
  // résultats
  'r-open': el => { UI.resultSel = el.dataset.id; render(); window.scrollTo(0, 0); },
  'r-back': () => { UI.resultSel = null; render(); },
  'r-csv': () => exportCSV(DB.sessions.find(s => s.id === UI.resultSel)),
  'r-del': async () => { if (await confirmBox('Supprimer cette séance et ses résultats ?', 'Supprimer')) { DB.sessions = DB.sessions.filter(s => s.id !== UI.resultSel); UI.resultSel = null; save(); render(); } },
  // séance
  'session-start': () => startSession(),
  'session-end': () => endSession(),
  'session-quit': async () => { if (await confirmBox('Abandonner la séance sans enregistrer les résultats ?', 'Abandonner')) { if (Cam.running) stopScan(); DB.active = null; releaseWakeLock(); save(); render(); } },
  'scan': () => Cam.running ? stopScan() : startScan(),
  'reveal': () => { const A = DB.active; A.revealed[A.qIndex] = !A.revealed[A.qIndex]; if (A.revealed[A.qIndex] && Cam.running) stopScan(); save(); render(); },
  'q-prev': () => changeQuestion(-1),
  'q-next': () => changeQuestion(1),
  'chip': el => chipVote(+el.dataset.card),
  'chip-set': el => { const A = DB.active; const votes = A.votes[A.qIndex] || (A.votes[A.qIndex] = {}); const c = +el.dataset.card; if (el.dataset.v) votes[c] = el.dataset.v; else delete votes[c]; save(); closeModal(); updateLive(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const f = ACT[el.dataset.act];
  if (f) { e.preventDefault(); f(el, e); }
});

// Saisie au clavier (sans re-rendu pour garder le focus)
document.addEventListener('input', e => {
  const el = e.target, f = el.dataset.f;
  if (f) {
    if (['qname', 'qtext', 'atext'].includes(f)) {
      const q = getQcm(UI.editQcm); if (!q) return;
      if (f === 'qname') q.name = el.value;
      if (f === 'qtext') q.questions[+el.dataset.qi].text = el.value;
      if (f === 'atext') q.questions[+el.dataset.qi].answers[+el.dataset.ai].text = el.value;
      touchQcm(q);
    } else if (['gname', 'snom', 'sprenom'].includes(f)) {
      const g = getGroup(UI.groupSel); if (!g) return;
      if (f === 'gname') g.name = el.value;
      if (f === 'snom') g.students[+el.dataset.si].nom = el.value;
      if (f === 'sprenom') g.students[+el.dataset.si].prenom = el.value;
      save();
    }
  }
});
document.addEventListener('change', async e => {
  const el = e.target;
  const f = el.dataset.f;
  if (f === 'acorrect') { const q = getQcm(UI.editQcm); q.questions[+el.dataset.qi].answers[+el.dataset.ai].correct = el.checked; touchQcm(q); render(); return; }
  if (f === 'qname' || f === 'gname') { renderNav(); if (f === 'gname') render(); return; }
  if (f === 'qimg') {
    const file = el.files[0]; if (!file) return;
    try { const q = getQcm(UI.editQcm); q.questions[+el.dataset.qi].image = await resizeImage(file); touchQcm(q); render(); }
    catch (err) { toast("Image illisible", 'err'); }
    return;
  }
  if (f === 'scard') {
    const g = getGroup(UI.groupSel); const s = g.students[+el.dataset.si];
    const v = parseInt(el.value, 10);
    if (!(v >= 1 && v <= maxCard())) { toast(`Numéro entre 1 et ${maxCard()}`, 'warn'); render(); return; }
    const other = g.students.find(x => x !== s && x.card === v);
    if (other) { other.card = s.card; toast(`Échange avec ${other.prenom || other.nom} (n°${s.card})`, 'warn'); }
    s.card = v; save(); render(); return;
  }
  if (el.dataset.set) {
    const k = el.dataset.set;
    DB.settings[k] = el.type === 'checkbox' ? el.checked : (isNaN(+el.value) ? el.value : +el.value);
    save(); if (k === 'cardSet') { render(); toast(CARD_SETS[cardSet()].label + ' activées'); } return;
  }
  if (el.dataset.c) {
    const k = el.dataset.c;
    UI.cards[k] = el.type === 'checkbox' ? el.checked : el.value;
    render(); return;
  }
  if (el.id === 'su-group') { UI.setupGroup = el.value; $('#su-anon').classList.toggle('hidden', !!el.value); }
  if (el.id === 'su-n') UI.setupAnon = +el.value || 30;
  if (el.id === 'su-qcm') { UI.setupQcm = el.value; render(); }
});

// ======================================================================
//  Démarrage
// ======================================================================
function consumeInbox() {
  let box = [];
  try { box = JSON.parse(localStorage.getItem('qcm_inbox') || '[]'); } catch (e) {}
  if (!Array.isArray(box) || !box.length) return null;
  try { localStorage.removeItem('qcm_inbox'); } catch (e) {}
  let last = null;
  for (const it of box) {
    const r = importAny(it && it.text || '');
    if (r.error || !r.qcms || !r.qcms.length) continue;
    const q = r.qcms[0];
    if (it.title) q.name = it.title;
    q.source = it.source || '';
    DB.qcms.push(q);
    last = { q, it };
  }
  if (last) save();
  return last;
}
(async function init() {
  await Store.open();
  const saved = await Store.get();
  if (saved && saved.app === 'QCMScan') {
    DB = { ...DB, ...saved, settings: { ...DEFAULT_SETTINGS, ...(saved.settings || {}) } };
  }
  try {
    if (navigator.storage && navigator.storage.persist) {
      const p = await navigator.storage.persist();
      UI.persisted = p;
    }
  } catch (e) {}
  await loadLinked();
  if (typeof Verrou !== 'undefined') {
    const needAdmin = () => { if (Verrou.protectOn() && !Verrou.isAdmin()) Verrou.requireAdmin(() => {}, 'QCM en direct', () => { location.href = 'index.html'; }); };
    try { Verrou.boot(SUIVI_LOCK, { afterUnlock: needAdmin }); } catch (e) { console.error(e); }
  }
  const P = new URLSearchParams(location.search);
  const findGroup = (id, name) => (id && LINKED.find(g => g.suiviId === id)) || (name && allGroups().find(g => norm(g.name) === norm(name))) || null;
  const got = consumeInbox();
  if (got) {
    UI.setupQcm = got.q.id;
    const g = findGroup(got.it.suiviId, got.it.className);
    if (g) UI.setupGroup = g.id;
  }
  const pc = P.get('classe'), pt = P.get('tab');
  if (pc) { const g = findGroup(pc, pc); if (g) { UI.setupGroup = UI.groupSel = UI.cards.groupId = g.id; UI.cards.source = 'group'; } }
  if (pt && TABS.some(x => x[0] === pt)) UI.tab = pt;
  else if (DB.active || got) UI.tab = 'session';
  if (location.search) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
  render();
  if (got) {
    if (DB.active) toast(`QCM « ${got.q.name} » reçu. Terminez d'abord la séance en cours.`, 'warn', 5000);
    else toast(`QCM reçu de ${got.it.source || 'Suivi de classe'} : vérifiez la classe puis « Démarrer »`, 'ok', 4500);
  }
  const pi = () => { const el = $('#persist-info'); if (el) el.textContent = UI.persisted ? 'Stockage persistant accordé par le navigateur.' : 'Stockage non garanti par le navigateur : pensez à exporter.'; };
  new MutationObserver(pi).observe($('#app'), { childList: true });
  pi();
})();
