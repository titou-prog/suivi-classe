<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Suivi de classe">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Suivi de classe — iPad</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--accent:#4f46e5;--good:#15803d;--bad:#dc2626;--nav:rgba(255,255,255,.92)}
:root.dark{--bg:#0b1020;--card:#151b2e;--text:#f4f7fb;--muted:#a8b0c0;--line:#2a3247;--nav:rgba(11,16,32,.94)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text)}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}button,input,select,textarea{font:inherit}button{min-height:44px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);padding:9px 14px;cursor:pointer;touch-action:manipulation}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button.danger{color:var(--bad)}button:active{transform:scale(.98)}
.app{min-height:100vh;display:flex}.sidebar{display:none}.main{width:100%;padding:16px 16px 92px;max-width:1500px;margin:auto}.topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}.title{font-size:24px;font-weight:800}.sub{color:var(--muted);font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 3px 18px rgba(0,0,0,.04)}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.grow{flex:1}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(2,1fr)}.stat{padding:14px;border-radius:18px;background:linear-gradient(135deg,rgba(79,70,229,.10),transparent);border:1px solid var(--line)}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--muted)}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:13px;padding:11px 12px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12)}.controls{display:grid;grid-template-columns:1fr;gap:9px}
.students{grid-template-columns:repeat(2,minmax(0,1fr))}.student{padding:12px;border:1px solid var(--line);border-radius:20px;background:var(--card);min-width:0}.avatar{width:100%;aspect-ratio:3/4;border-radius:16px;margin:auto;display:grid;place-items:center;color:white;font-weight:800;font-size:19px;overflow:hidden;background:#64748b}.avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 40%}.student h3{font-size:15px;text-align:center;margin:9px 0 6px;overflow-wrap:anywhere}.score{display:flex;justify-content:center;gap:12px;font-weight:700}.plus{color:var(--good)}.minus{color:var(--bad)}.balance{text-align:center;font-size:12px;color:var(--muted);margin-top:5px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.actions button{font-size:13px;padding:7px 6px}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:8px max(8px,env(safe-area-inset-left)) max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:7px;background:var(--nav);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:20}.bottom button{border:0;background:transparent;font-size:12px}.bottom button.active{background:rgba(79,70,229,.12);color:var(--accent);font-weight:800}
.behavior{display:flex;gap:9px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0}.behavior.bonus{background:rgba(21,128,61,.08)}.behavior.malus{background:rgba(220,38,38,.08)}.emoji{font-size:23px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:50;display:none;align-items:flex-end;justify-content:center;padding:0}.modal.show{display:flex}.sheet{width:100%;max-height:92vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));}.sheet h2{margin-top:0}.list{max-height:45vh;overflow:auto}.checkrow{display:flex;align-items:center;gap:10px;padding:9px;border-bottom:1px solid var(--line)}.checkrow input{width:22px;height:22px}.empty{text-align:center;color:var(--muted);padding:36px 12px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:white;padding:11px 16px;border-radius:999px;z-index:100;display:none}.toast.show{display:block}.small{font-size:12px;color:var(--muted)}.section-title{font-size:18px;font-weight:800;margin:4px 0 10px}.danger-zone{border-color:rgba(220,38,38,.4)}
@media(min-width:700px){.main{padding:22px 24px 30px}.stats{grid-template-columns:repeat(4,1fr)}.controls{grid-template-columns:2fr 1fr 1fr}.students{grid-template-columns:repeat(4,minmax(0,1fr))}.bottom{display:none}}
@media(min-width:1100px){.app{max-width:1500px;margin:auto}.sidebar{display:flex;flex-direction:column;width:240px;min-height:100vh;border-right:1px solid var(--line);background:var(--card);padding:20px;position:sticky;top:0;height:100vh}.sidebtn{width:100%;text-align:left;margin:4px 0}.main{padding:26px 30px}.students{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media(orientation:landscape) and (min-width:700px){.students{grid-template-columns:repeat(5,minmax(0,1fr))}}
</style></head>
<body>
<div class="app"><aside class="sidebar"><div class="title">🎵 Suivi de classe</div><div class="sub" style="margin:4px 0 18px">Version iPad · V8</div><button class="sidebtn" onclick="setTab('class')">👥 Élèves</button><button class="sidebtn" onclick="setTab('behaviors')">⭐ Comportements</button><button class="sidebtn" onclick="setTab('data')">💾 Données</button><div style="flex:1"></div><button class="sidebtn" onclick="openSettings()">⚙️ Réglages</button></aside>
<main class="main"><div class="topbar"><div><div class="title">Suivi de classe</div><div class="sub" id="status">Prêt</div></div><button onclick="toggleTheme()">🌓</button></div><div id="view"></div></main></div>
<nav class="bottom"><button id="nav-class" onclick="setTab('class')">👥<br>Élèves</button><button onclick="randomStudent()">🎲<br>Aléatoire</button><button id="nav-behaviors" onclick="setTab('behaviors')">⭐<br>Comportements</button><button id="nav-reports" onclick="setTab('reports')">📋<br>Rapports</button><button id="nav-data" onclick="setTab('data')">💾<br>Données</button></nav>
<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div><div id="toast" class="toast"></div>
<script src="app.js"></script></body></html>
