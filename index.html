<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Suivi de classe">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Suivi de classe — iPad</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--accent:#4f46e5;--good:#15803d;--bad:#dc2626;--nav:rgba(255,255,255,.92)}
:root.dark{--bg:#0b1020;--card:#151b2e;--text:#f4f7fb;--muted:#a8b0c0;--line:#2a3247;--nav:rgba(11,16,32,.94)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text)}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}button,input,select,textarea{font:inherit}button{min-height:44px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);padding:9px 14px;cursor:pointer;touch-action:manipulation}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button.danger{color:var(--bad)}button:active{transform:scale(.98)}
.app{min-height:100vh;display:flex}.sidebar{display:none}.main{width:100%;padding:16px 16px 92px;max-width:1500px;margin:auto}.topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}.title{font-size:24px;font-weight:800}.sub{color:var(--muted);font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 3px 18px rgba(0,0,0,.04)}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.grow{flex:1}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(2,1fr)}.stat{padding:14px;border-radius:18px;background:linear-gradient(135deg,rgba(79,70,229,.10),transparent);border:1px solid var(--line)}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--muted)}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:13px;padding:11px 12px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12)}.controls{display:grid;grid-template-columns:1fr;gap:9px}
.students{grid-template-columns:repeat(2,minmax(0,1fr))}.student{padding:12px;border:1px solid var(--line);border-radius:20px;background:var(--card);min-width:0}.avatar{width:100%;aspect-ratio:3/4;border-radius:16px;margin:auto;display:grid;place-items:center;color:white;font-weight:800;font-size:19px;overflow:hidden;background:#64748b}.avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 40%}.student h3{font-size:15px;text-align:center;margin:9px 0 6px;overflow-wrap:anywhere}.score{display:flex;justify-content:center;gap:12px;font-weight:700}.plus{color:var(--good)}.minus{color:var(--bad)}.balance{text-align:center;font-size:12px;color:var(--muted);margin-top:5px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.actions button{font-size:13px;padding:7px 6px}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:8px max(8px,env(safe-area-inset-left)) max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(7,1fr);gap:7px;background:var(--nav);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:20}.bottom button{border:0;background:transparent;font-size:12px}.bottom button.active{background:rgba(79,70,229,.12);color:var(--accent);font-weight:800}
.behavior{display:flex;gap:9px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0}.behavior.bonus{background:rgba(21,128,61,.08)}.behavior.malus{background:rgba(220,38,38,.08)}.emoji{font-size:23px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:50;display:none;align-items:flex-end;justify-content:center;padding:0}.modal.show{display:flex}.sheet{width:100%;max-height:92vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));}.sheet h2{margin-top:0}.list{max-height:45vh;overflow:auto}.checkrow{display:flex;align-items:center;gap:10px;padding:9px;border-bottom:1px solid var(--line)}.checkrow input{width:22px;height:22px}.empty{text-align:center;color:var(--muted);padding:36px 12px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:white;padding:11px 16px;border-radius:999px;z-index:100;display:none}.toast.show{display:block}.small{font-size:12px;color:var(--muted)}.section-title{font-size:18px;font-weight:800;margin:4px 0 10px}.danger-zone{border-color:rgba(220,38,38,.4)}
@media(min-width:700px){.main{padding:22px 24px 30px}.stats{grid-template-columns:repeat(4,1fr)}.controls{grid-template-columns:2fr 1fr 1fr}.students{grid-template-columns:repeat(4,minmax(0,1fr))}.main{padding-bottom:104px}}
@media(min-width:1100px){.bottom{display:none}.app{max-width:1500px;margin:auto}.sidebar{display:flex;flex-direction:column;width:240px;min-height:100vh;border-right:1px solid var(--line);background:var(--card);padding:20px;position:sticky;top:0;height:100vh}.sidebtn{width:100%;text-align:left;margin:4px 0}.main{padding:26px 30px}.students{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media(orientation:landscape) and (min-width:700px){.students{grid-template-columns:repeat(5,minmax(0,1fr))}}
.recap{width:100%;border-collapse:collapse;min-width:420px}.recap th,.recap td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:center;font-size:15px}.recap th:first-child,.recap td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}.recap thead th{background:var(--card);vertical-align:bottom}.recap tfoot td{border-top:2px solid var(--line);border-bottom:0;background:var(--bg)}.recap tfoot td:first-child{background:var(--bg)}
.panel.tight{padding:10px 12px;margin-bottom:10px;border-radius:18px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.students.sz-s{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}.students.sz-m{grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.student.compact{padding:8px;border-radius:16px}.student.compact .top{display:flex;align-items:center;gap:8px;min-width:0;cursor:default;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.student.compact .avatar{width:46px;height:46px;aspect-ratio:auto;border-radius:50%;margin:0;flex:none;font-size:15px}.sz-m .student.compact .avatar{width:74px;height:74px;border-radius:16px;font-size:20px}
.student.compact .info{min-width:0;flex:1}.student.compact h3{font-size:14px;line-height:1.15;text-align:left;margin:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}.sz-m .student.compact h3{font-size:16px}
.student.compact .score{justify-content:flex-start;gap:9px;font-size:14px;margin-top:3px}.student.compact .actions{margin-top:7px;gap:6px}.student.compact .actions button{min-height:42px;font-size:14px;font-weight:700;padding:6px 4px}
.actions .bplus{background:rgba(21,128,61,.12);border-color:rgba(21,128,61,.4)}.actions .bminus{background:rgba(220,38,38,.10);border-color:rgba(220,38,38,.35)}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.pickbtn{display:flex;align-items:center;gap:10px;text-align:left;min-height:54px;font-size:16px}.pickbtn.bonus{background:rgba(21,128,61,.10)}.pickbtn.malus{background:rgba(220,38,38,.09)}.sheet{max-width:860px}
@media print{.bottom,.sidebar,.topbar,.noprint,.toast,.modal{display:none!important}body{padding:0}.main{padding:0}.panel{box-shadow:none;break-inside:avoid}.recap th,.recap td{padding:5px 6px;font-size:12px}}
/* ===== V27 : interface allégée (menu ☰, barre d'outils compacte) ===== */
.main{padding-bottom:28px!important;max-width:1400px;margin:0 auto!important}
.topbar{position:sticky;top:0;z-index:25;background:var(--bg);padding:8px 0 10px;margin-bottom:8px}
.topbar .title{font-size:21px}
#topBtns{display:flex;gap:8px;align-items:center}
.menubtn{min-height:46px;padding:8px 16px;font-size:16px;font-weight:800;border-radius:14px}
.tb{flex-wrap:nowrap;gap:8px}
.clsel{font-size:18px;font-weight:800;min-height:48px;min-width:0}
.iconbtn{min-width:48px;min-height:48px;font-size:19px;padding:6px;border-radius:14px}
.iconbtn.on{background:var(--soft,#eef2ff);border-color:var(--accent)}
.tbbtn{min-height:48px;padding:8px 14px;font-size:15px;white-space:nowrap;border-radius:14px}
.statline{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.statline b{font-weight:800}
.edt{padding:8px 10px!important;margin-bottom:10px!important;border-radius:18px!important}
.edt-row{flex-wrap:nowrap;gap:8px}
.edt-mid{min-width:0;cursor:pointer;line-height:1.3;padding:4px 2px}
.edt-mid b{font-size:17px}
.edt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;margin-top:8px}
.edt-box{border:1px solid var(--line);border-radius:14px;padding:9px 11px}
.edt-box .h{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.03em}
.edt-box.dv{border-color:rgba(79,70,229,.35);background:rgba(79,70,229,.07)}
.dvchip{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:rgba(79,70,229,.12);color:var(--accent);white-space:nowrap}
#menuWrap{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.28);display:none}
#menuWrap.show{display:block}
#menuPanel{position:absolute;top:calc(62px + env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));width:min(400px,calc(100vw - 24px));max-height:calc(100vh - 90px);overflow:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.25);padding:8px}
.msec{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 4px}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;min-height:48px;padding:8px 10px;border-radius:12px;font-size:16px;font-weight:650}
.mi:active,.mi:hover{background:var(--bg)}
.mi:disabled{opacity:.4}
.mi-ic{width:28px;text-align:center;font-size:19px}
.mi-lock{font-size:13px;opacity:.7}
.seg{display:flex;gap:4px;padding:2px 10px 6px;flex-wrap:wrap}
.seg button{min-height:38px;padding:4px 12px;border-radius:999px;font-size:14px}
.seg button.on{background:var(--text);color:var(--card);border-color:var(--text)}
.mfoot{font-size:12px;color:var(--muted);text-align:center;padding:10px}
@media(max-width:640px){.tbbtn .lbl{display:none}}
</style></head>
<body>
<script src="verrou.js"></script>
<div class="app">
<main class="main"><div class="topbar"><div><div class="title">🎵 Suivi de classe</div><div class="sub" id="status">Version V29</div></div><div id="topBtns"><button class="menubtn" onclick="openMenu()">☰ Menu</button></div></div><div id="view"><div class="panel empty"><p class="small">Chargement des données…</p></div></div></main></div>

<div id="menuWrap" onclick="if(event.target===this)closeMenu()"><div id="menuPanel"></div></div><div id="modal" class="modal"><div class="sheet" id="sheet"></div></div><div id="toast" class="toast"></div>
<script src="app.js"></script></body></html>
